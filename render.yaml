# ALMANTHOMH EO CN V5 — Render Blueprint
# Deploy the existing Dockerfile as a real public FastAPI service.
# Required secrets must be entered in Render's private Environment settings.
services:
  - type: web
    name: almanthomh-eo-server
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: COOKIE_SECURE
        value: "true"
      - key: EO_VAULT_DIR
        value: /srv/alm/vault
      - key: EO_VAULT_RUNTIME_DIR
        value: /run/eo-runtime
      - key: DATABASE_URL
        sync: false
      - key: EO_MASTER_KEY
        sync: false
      - key: TOTP_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_BOOTSTRAP_KEY
        sync: false
      - key: USER_ACCESS_CODE_HASH
        value: 32d0812d9741f3542b0f2eba898868d8bff97877f9db2994a0a1f4073f9e62a9
      - key: DEVELOPER_ACCESS_CODE_HASH
        sync: false
      - key: EMERGENCY_VAULT_CODE_HASH
        sync: false
